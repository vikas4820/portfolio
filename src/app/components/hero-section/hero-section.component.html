<!-- Hero Section -->
<section id="hero" class="hero section light-background">
    <picture>
        <source media="(max-width: 767px)" srcset="img/hero-bg1-optimized.webp" />
        <img src="img/hero-bg2-optimized.webp" alt="" fetchpriority="high" decoding="async" />
    </picture>

    <div class="container hero-content">
        <div class="row justify-content-center">
            <div class="col-lg-9">
                <span class="hero-eyebrow">Full-stack developer &middot; Available for select projects</span>
                <h2>Building digital products that feel <em>effortless.</em></h2>
                <p>
                    Vikas Singh &mdash;
                    <span class="typed"
                        data-typed-items="Full-Stack Developer, Frontend Engineer, Backend Specialist, Software Engineer, Web Developer">Developer</span>
                </p>
                <div class="hero-actions">
                    <a class="primary-action" href="#portfolio">View my work <i class="bi bi-arrow-down-right"></i></a>
                    <a class="secondary-action" href="resume/Vikas_Singh_Resume.pdf" download>Download r&eacute;sum&eacute; <i class="bi bi-download"></i></a>
                </div>
                <div class="social-links">
                    <a href="{{ profileInfo.twitter }}" target="_blank" rel="noopener noreferrer" aria-label="X profile"><i class="bi bi-twitter-x"></i></a>
                    <a href="{{ profileInfo.facebook }}" target="_blank" rel="noopener noreferrer" aria-label="Facebook profile"><i class="bi bi-facebook"></i></a>
                    <a href="{{ profileInfo.instagram }}" target="_blank" rel="noopener noreferrer" aria-label="Instagram profile"><i class="bi bi-instagram"></i></a>
                    <a href="{{ profileInfo.linkedin }}" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn profile"><i class="bi bi-linkedin"></i></a>
                    <a href="{{ profileInfo.github }}" target="_blank" rel="noopener noreferrer" aria-label="GitHub profile"><i class="bi bi-github"></i></a>
                </div>
            </div>
        </div>
    </div>
</section>
<!-- /Hero Section -->
